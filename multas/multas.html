<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Gestión de Flota - MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="./multas.js"></script>
</head>

<body class="bg-gray-100 text-gray-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">🚍 Gestión de Flota</h1>
            <p class="text-sm text-blue-200">Panel operativo diario</p>
        </div>

        <!-- Botón mobile -->
        <button id="btn-menu" class="md:hidden text-2xl">
            ☰
        </button>
    </header>

    <!-- Layout -->
    <div class="flex flex-1 relative">

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static z-40 w-64 h-full bg-blue-800 text-white flex flex-col
                   transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <nav class="flex-1 p-4 space-y-2">

                <a href="../index.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🚍 Toda la Flota
                </a>

                <a href="../estadosGenerales.html/estadoGeneral.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📊 Estados generales
                </a>

                <a class="block px-4 py-2 rounded bg-blue-500">
                    🚨 Multas
                </a>

                <a href="../mantenimiento/mantenimiento.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🔧 Mantenimiento
                </a>

                <a href="../reportes/reportes.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📑Agregar Reportes
                </a>

                <a href="../agregarUnidad/agregarUnidad.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    ➕Agregar unidad
                </a>

                <a href="../retirarUnidad/retirarUnidad.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    ❌Retirar unidad
                </a>

            </nav>
        </aside>

        <!-- Overlay mobile -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-40 hidden md:hidden z-30"></div>

        <!-- Main content -->
        <main class="flex-1 p-6 overflow-auto">

            <h2 class="text-3xl text-blue-700 font-bold text-center border-b-4 border-blue-700 mb-6">
                MULTAS
            </h2>

            <section class="p-6 bg-white rounded shadow mb-6">
                <h3 class="text-xl font-bold mb-3">Filtrar Multas</h3>
                <form action="./multas.html" method="get" class="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <div>
                        <label class="block text-sm font-semibold mb-1" for="interno-multa">Interno</label>
                        <input type="text" id="interno-multa" name="interno" placeholder="A12"
                            class="w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1" for="patente-multa">Patente</label>
                        <input type="text" id="patente-multa" name="patente" placeholder="AB123CD"
                            class="w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1" for="motivo-multa">Motivo de Multa</label>
                        <input type="text" id="motivo-multa" name="motivo" placeholder="Semáforo en rojo"
                            class="w-full p-2 border rounded">
                    </div>

                    <div class="md:col-span-3 text-right">
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                            Filtrar
                        </button>
                    </div>
                </form>
            </section>


            <div class="bg-white p-6 rounded shadow mb-6">
                <h3 class="text-xl font-bold text-blue-600 mb-4">Agregar nueva multa <button id="abrir-form-multas">➕</button></h3>

                <form id="form-multa" class="hidden space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Bus (interno)</label>
                        <select id="bus-multa" class="mt-1 block w-full p-2 border rounded">
                            <!-- Opciones se llenan por JS -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tipo de multa</label>
                        <input type="text" id="tipo-multa" class="mt-1 block w-full p-2 border rounded" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fecha</label>
                        <input type="date" id="fecha-multa" class="mt-1 block w-full p-2 border rounded" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Lugar</label>
                        <input type="text" id="lugar-multa" class="mt-1 block w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Monto</label>
                        <input type="number" id="monto-multa" class="mt-1 block w-full p-2 border rounded" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Responsable</label>
                        <input type="text" id="responsable-multa" class="mt-1 block w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Estado</label>
                        <select id="estado-multa" class="mt-1 block w-full p-2 border rounded">
                            <option value="pendiente">Pendiente</option>
                            <option value="pagada">Pagada</option>
                        </select>
                    </div>

                    <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                        Agregar Multa
                    </button>

                </form>
            </div>


            <div id="multas-container" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>

        </main>
    </div>

</body>

</html>
