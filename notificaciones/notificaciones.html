<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Flota - MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./index.js"></script>
    <script type="module" src="./notificaciones.js"></script>
</head>

<body class="bg-gray-100 text-gray-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center">

        <button id="btn-menu" class="md:hidden text-2xl">
            ☰
        </button>

        <div>
            <h1 class="text-2xl font-bold">🚍 Gestión de Flota</h1>
            <p class="text-sm text-blue-200 text-end">
                Panel operativo diario
            </p>
        </div>

    </header>

    <!-- Layout -->
    <div class="flex flex-1 relative">

        <!-- Sidebar -->
        <aside id="sidebar"
            class="fixed md:static z-40 w-64 h-full bg-blue-800 text-white flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300">

            <nav class="relative flex-1 p-4 space-y-2">

                <a class="flex items-center gap-2 px-4 py-2 rounded bg-blue-500">
                    <span>🔔 Notificaciones</span>
                    <span class="bg-red-500 text-lg rounded-full px-3 font-bold">
                        !
                    </span>
                </a>

                <a href="../index.html"
                    class="block px-4 py-2 rounded hover:bg-blue-700">
                    🚍 Toda la Flota
                </a>

                <a href="../estadosGenerales.html/estadoGeneral.html"
                    class="block px-4 py-2 rounded hover:bg-blue-700">
                    📊 Estados generales
                </a>

                <a href="../habilitaciones/habilitaciones.html"
                    class="block px-4 py-2 rounded hover:bg-blue-700">
                    📜 Habilitaciones
                </a>

                <a href="../multas/multas.html"
                    class="block px-4 py-2 rounded hover:bg-blue-700">
                    🚨 Multas
                </a>

                <a href="../mantenimiento/mantenimiento.html"
                    class="block px-4 py-2 rounded hover:bg-blue-700">
                    🔧 Mantenimiento
                </a>

                <a href="../reportes/reportes.html"
                    class="block px-4 py-2 rounded hover:bg-blue-700">
                    📑 Agregar Reportes
                </a>

                <a href="../agregarUnidad/agregarUnidad.html"
                    class="block px-4 py-2 rounded hover:bg-blue-700">
                    ➕ Agregar unidad
                </a>

                <a href="../retirarUnidad/retirarUnidad.html"
                    class="block px-4 py-2 rounded hover:bg-blue-700">
                    ❌ Retirar unidad
                </a>

                <p id="version"
                    class="absolute bottom-24 text-xs text-center p-3 md:bottom-1">
                </p>

            </nav>

        </aside>

        <!-- Overlay mobile -->
        <div id="overlay"
            class="fixed inset-0 bg-black bg-opacity-40 hidden md:hidden z-30">
        </div>

        <!-- Main -->
        <main class="flex-1 p-6 overflow-auto">

            <h1 class="text-3xl font-bold mb-6 text-gray-800">
                Alertas de Vencimientos
            </h1>

            <div id="alertasContainer" class="flex flex-col gap-4">
                <p class="text-gray-500">
                    Cargando alertas...
                </p>
            </div>

        </main>

    </div>

</body>

</html>
