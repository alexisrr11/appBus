<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Flota - MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="/mantenimiento.js"></script>
</head>

<body class="bg-gray-100 text-gray-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center">
        <!-- Botón mobile -->
        <button id="btn-menu" class="md:hidden text-2xl">
            ☰
        </button>
        
        <div>
            <h1 class="text-2xl font-bold">🚍 Gestión de Flota</h1>
            <p class="text-sm text-blue-200 text-end">Panel operativo diario</p>
        </div>

        
    </header>

    <!-- Layout -->
    <div class="flex flex-1 relative">

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static z-40 w-64 h-full bg-blue-800 text-white flex flex-col
                   transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <nav class="flex-1 p-4 space-y-2">

                <a href="/notificaciones" class="flex items-center gap-2 block px-4 py-2 rounded hover:bg-blue-700">
                    <span>🔔 Notificaciones</span>
                    <span class="bg-red-500 text-lg rounded-full px-3 font-bold">
                        !
                    </span>
                </a>

                <a href="/" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🚍 Toda la Flota
                </a>

                <a href="/estadosGenerales" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📊 Estados generales
                </a>

                <a href="/habilitaciones" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📜Habilitaciones
                </a>

                <a href="/multas" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🚨 Multas
                </a>

                <a class="block px-4 py-2 rounded bg-blue-500">
                    🔧 Mantenimiento
                </a>

                <a href="/reportes" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📑Agregar Reportes
                </a>

                <a href="/agregarUnidad" class="block px-4 py-2 rounded hover:bg-blue-700">
                    ➕Agregar unidad
                </a>

                <a href="/retirarUnidad" class="block px-4 py-2 rounded hover:bg-blue-700">
                    ❌Retirar unidad
                </a>

            </nav>
        </aside>

        <!-- Overlay mobile -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-40 hidden md:hidden z-30"></div>

        <!-- Main content -->
        <main class="flex-1 p-6 overflow-auto">

            <h2 class="text-3xl text-blue-700 font-bold text-center border-b-4 border-blue-700 mb-6">
                MANTENIMIENTO
            </h2>

            <section class="p-6 bg-white rounded shadow mb-6">
                <h3 class="text-xl font-bold mb-3">Filtrar Mantenimiento</h3>
                <form action="/mantenimiento" method="get" class="grid grid-cols-1 md:grid-cols-3 gap-4">

                    <div>
                        <label class="block text-sm font-semibold mb-1" for="interno-mantenimiento">Interno</label>
                        <input type="text" id="interno-mantenimiento" name="interno" placeholder="A12"
                            class="w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1" for="patente-mantenimiento">Patente</label>
                        <input type="text" id="patente-mantenimiento" name="patente" placeholder="AB123CD"
                            class="w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-1" for="tipo-falla">Tipo de Falla</label>
                        <input type="text" id="tipo-falla" name="tipo" placeholder="Falla en suspensión"
                            class="w-full p-2 border rounded">
                    </div>

                    <div class="md:col-span-3 text-right">
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                            Filtrar
                        </button>
                    </div>
                </form>
            </section>


            <div class="bg-white p-6 rounded shadow mb-6">
                <h3 class="text-xl font-bold text-blue-700 mb-4">Agregar nuevo mantenimiento <button id="abrir-formulario">➕</button></h3>

                <form id="form-mantenimiento" class="hidden space-y-4">

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Bus (interno)</label>
                        <select id="bus-interno" class="mt-1 block w-full p-2 border rounded">
                            <!-- Opciones se llenan por JS -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tipo</label>
                        <select id="tipo" class="mt-1 block w-full p-2 border rounded">
                            <option value="service">Service</option>
                            <option value="falla">Falla</option>
                            <option value="mantenimiento">Mantenimiento</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Fecha</label>
                        <input type="date" id="fecha" class="mt-1 block w-full p-2 border rounded" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Detalle</label>
                        <textarea id="detalle" class="mt-1 block w-full p-2 border rounded" rows="2"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Km (opcional)</label>
                        <input type="number" id="km" class="mt-1 block w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Taller (opcional)</label>
                        <input type="text" id="taller" class="mt-1 block w-full p-2 border rounded">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Reportado por (opcional)</label>
                        <input type="text" id="reportadoPor" class="mt-1 block w-full p-2 border rounded">
                    </div>

                    <button type="submit" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800">
                        Agregar Mantenimiento
                    </button>

                </form>
            </div>


            <div id="listado-mantenimientos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        </main>
    </div>

</body>

</html>
