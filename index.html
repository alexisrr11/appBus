<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Flota - MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./index.js"></script>
    <script type="module" src="./scripts/menu.js"></script>
</head>

<body class="bg-gray-100 text-gray-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center">
        <!-- Botón mobile -->
        <button id="btn-menu" class="md:hidden text-2xl">
            ☰
        </button>

        <div>
            <h1 class="text-2xl font-bold">🚍 Gestión de Flota</h1>
            <p class="text-sm text-blue-200 text-end">Panel operativo diario</p>
        </div>


    </header>

    <!-- Layout -->
    <div class="flex flex-1 relative">

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static z-40 w-64 h-full bg-blue-800 text-white flex flex-col
                   transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <nav class="relative flex-1 p-4 space-y-2">

                <a href="/notificaciones" class="flex items-center gap-2 block px-4 py-2 rounded hover:bg-blue-700">
                    <span>🔔 Notificaciones</span>
                    <span class="bg-red-500 text-lg rounded-full px-3 font-bold">
                        !
                    </span>
                </a>

                <a class="block px-4 py-2 rounded bg-blue-500">
                    🚍 Toda la Flota
                </a>

                <a href="/estados-generales" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📊 Estados generales
                </a>

                <a href="/habilitaciones" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📜Habilitaciones
                </a>

                <a href="/multas" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🚨 Multas
                </a>

                <a href="/mantenimiento" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🔧 Mantenimiento
                </a>

                <a href="/reportes" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📑Agregar Reportes
                </a>

                <a href="/agregar-unidad" class="block px-4 py-2 rounded hover:bg-blue-700">
                    ➕Agregar unidad
                </a>

                <a href="/retirar-unidad" class="block px-4 py-2 rounded hover:bg-blue-700">
                    ❌Retirar unidad
                </a>

                <p id="version" class="absolute bottom-24 text-xs text-center p-3 md:bottom-1"></p>
            </nav>
            
        </aside>

        <!-- Overlay mobile -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-40 hidden md:hidden z-30"></div>

        <!-- Main content -->
        <main class="flex-1 p-6 overflow-auto">

            <h2 class="text-3xl text-blue-700 font-bold text-center border-b-4 border-blue-700 mb-6">
                TODA LA FLOTA
            </h2>

            <!-- Filtros -->
            <div class="bg-white rounded shadow p-4 mb-6 flex flex-col md:flex-row gap-4">
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-600">Estado</label>
                    <select id="filtro-estado"
                        class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">Todos</option>
                        <option value="activa" class="text-green-500">🟢Activa</option>
                        <option value="mantenimiento" class="text-yellow-500">🟡Mantenimiento</option>
                        <option value="fuera_de_servicio" class="text-red-500">🔴Fuera de servicio</option>
                        <option value="baja_definitiva">⚫Baja definitiva</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-600">Interno</label>
                    <input id="filtro-interno" type="text" placeholder="Ej: A12"
                        class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-600">Patente</label>
                    <input id="filtro-patente" type="text" placeholder="Ej: AB123CD"
                        class="border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>

            </div>

            <div id="listado-flota" class="bg-white rounded shadow overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-200 text-left">
                        <tr>
                            <th class="p-3">Interno</th>
                            <th class="p-3">Patente</th>
                            <th class="p-3">Modelo</th>
                            <th class="p-3">Capacidad</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3 text-center">Historial</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-flota"></tbody>
                </table>
            </div>

        </main>
    </div>

</body>

</html>
