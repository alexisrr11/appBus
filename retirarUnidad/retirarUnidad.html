<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Flota - MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="../scripts/menu.js"></script>
    <script type="module" src="./estadosGenerales.js"></script>
</head>

<body class="bg-gray-100 text-gray-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center">
        <!-- Botón mobile -->
        <button id="btn-menu" class="md:hidden text-2xl">
            ☰
        </button>
        
        <div>
            <h1 class="text-2xl font-bold">🚍 Gestión de Flota</h1>
            <p class="text-sm text-blue-200 text-end">Panel operativo diario</p>
        </div>

        
    </header>

    <!-- Layout -->
    <div class="flex flex-1 relative">

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static z-40 w-64 h-full bg-blue-800 text-white flex flex-col
                   transform -translate-x-full md:translate-x-0 transition-transform duration-300">
            <nav class="flex-1 p-4 space-y-2">

                <a href="../index.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🚍 Toda la Flota
                </a>

                <a class="block px-4 py-2 rounded hover:bg-blue-700">
                    📊 Estados generales
                </a>

                <a href="../habilitaciones/habilitaciones.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📜Habilitaciones
                </a>

                <a href="../multas/multas.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🚨 Multas
                </a>

                <a href="../mantenimiento/mantenimiento.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    🔧 Mantenimiento
                </a>

                <a href="../reportes/reportes.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    📑Agregar Reportes
                </a>

                <a href="../agregarUnidad/agregarUnidad.html" class="block px-4 py-2 rounded hover:bg-blue-700">
                    ➕Agregar unidad
                </a>

                <a class="block px-4 py-2 rounded bg-blue-500">
                    ❌Retirar unidad
                </a>

            </nav>
        </aside>

        <!-- Overlay mobile -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-40 hidden md:hidden z-30"></div>

        <!-- Main content -->
        <main class="flex-1 p-6 overflow-auto">

            <h2 class="text-3xl text-blue-700 font-bold text-center border-b-4 border-blue-700 mb-6">
                DESVINCULAR UNIDAD
            </h2>

            <section class="p-6 bg-white rounded shadow mb-6">
                <h2 class="text-2xl font-bold text-red-600 mb-4">❌ Desvincular unidad</h2>

                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Interno de la unidad</label>
                        <input type="text" name="interno" class="w-full p-2 border rounded" placeholder="Ej: A12"
                            required>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Patente de la unidad</label>
                        <input type="text" name="patente" class="w-full p-2 border rounded" placeholder="Ej: AB123CD"
                            required>
                    </div>

                    <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                        Desvincular unidad
                    </button>
                </form>
            </section>


        </main>
    </div>

</body>

</html>
